# ------------------------------------------------
# key bindings & remaps
# ------------------------------------------------
unbind C-b
set-option -g prefix `
bind ` send-prefix

set -g base-index 1
set -g escape-time 20

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ------------------------------------------------
# Status bar
# ------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left side
set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-left-length 20

# Right side
set -g status-right "#[fg=#a6e3a1]%Y-%m-%d #[fg=#f9e2af]%I:%M %p "
set -g status-right-length 50

# ------------------------------------------------
# Window tabs
# ------------------------------------------------
set -g window-status-format " #I:#W "
set -g window-status-style "fg=#6c7086"

set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"

# ------------------------------------------------
# Pane borders
# ------------------------------------------------
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# ------------------------------------------------
# Messages
# ------------------------------------------------
set -g message-style "bg=#89b4fa,fg=#1e1e2e"

# ------------------------------------------------
# Mode styling (copy mode etc)
# ------------------------------------------------
set -g mode-style "bg=#313244,fg=#cdd6f4"

# ------------------------------------------------
# Terminal colors
# ------------------------------------------------
set -g default-terminal "screen-256color"

# https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/
#
